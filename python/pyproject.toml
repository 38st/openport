[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openport"
version = "0.1.0"
description = "Client for the openport options analytics and paper simulator API"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]
ws = ["websockets>=14"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
openport-mcp = "openport_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
