    "/api/risk/profile": {
      "parameters": [
        {
          "$ref": "#/components/parameters/account"
        },
        {
          "name": "underlying",
          "in": "query",
          "required": false,
          "description": "Profile one underlying's contracts and shares against its own moves; omitted, the whole book beta-weighted to the benchmark.",
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "benchmark",
          "in": "query",
          "required": false,
          "description": "The benchmark the whole book is weighted to (default SPY).",
          "schema": {
            "type": "string",
            "enum": [
              "SPY",
              "SPX"
            ]
          }
        },
        {
          "name": "days",
          "in": "query",
          "required": false,
          "description": "Up to eight comma-separated curve dates in calendar days from now (0 to 366, fractions allowed), or expiry for the first held expiry; default 0,1.",
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "iv",
          "in": "query",
          "required": false,
          "description": "Vol points added to every contract's smile IV (default 0).",
          "schema": {
            "type": "number",
            "minimum": -100,
            "maximum": 100
          }
        },
        {
          "name": "range",
          "in": "query",
          "required": false,
          "description": "The moves span plus and minus this percent (default 10).",
          "schema": {
            "type": "number",
            "exclusiveMinimum": 0,
            "maximum": 99
          }
        },
        {
          "name": "steps",
          "in": "query",
          "required": false,
          "description": "An odd number of moves, evenly spaced across the range (default 41).",
          "schema": {
            "type": "integer",
            "minimum": 3,
            "maximum": 201
          }
        },
        {
          "name": "betas",
          "in": "query",
          "required": false,
          "description": "Comma-separated SYMBOL:BETA overrides, each beta within 10 of zero.",
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "GET /api/risk/profile",
        "description": "The held book's P&L across moves of a reference price on several dates, where each date's curve reaches the floors, and beta-weighted delta. Analytical; nothing is recorded.",
        "x-scope": "read",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RiskProfile"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
