            "enum": [
              "day",
              "gtc",
              "ioc",
              "exto",
              "gtc_exto",
              "gtd"
            ]
          },
          "limit_price": {
            "type": "string"
          },
          "trigger": {
            "$ref": "#/components/schemas/Trigger"
          },
          "bracket": {
            "$ref": "#/components/schemas/Bracket"
          },
          "tags": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "note": {
            "type": "string"
          },
          "exits_only": {
            "type": "boolean",
            "description": "Attach the bracket to a held contract (symbol and the side that closes it) or held closing legs instead of submitting an entry. The order's own terms are the take-profit's, or the stop's when there is no target: GTC, EXTO, GTC_EXTO or GTD for a limit (a stop-limit's with its trigger), IOC, EXTO, GTC_EXTO or GTD for a triggered market stop. EXTO/GTC_EXTO trade in every product session; GTD gives both exits its explicit deadline."
          },
          "group": {
            "type": "string",
            "description": "Join the round trips this order opens to a whole trade, named by its ID or one of its open round trips' IDs (an adjustment). A multi-leg order that closes or adds to another order's round trip joins that trade without it (a roll). An order naming no trade holding an open round trip on its underlying, or attaching held exits, is refused with INVALID_GROUP."
          },
          "good_till": {
            "type": "string",
            "format": "date-time",
            "description": "Required only for gtd. ISO timestamp with Z or UTC offset, in the future and no more than 366 days after acceptance (market time). GTD trades regular hours; expires with GTD_END."
          },
          "walk": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Walk"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "quantity",
          "type",
          "time_in_force"
        ],
        "oneOf": [
          {
            "required": [
              "symbol",
              "side"
            ],
            "not": {
              "required": [
                "legs"
              ]
            }
          },
          {
            "required": [
              "legs"
            ],
            "not": {
              "anyOf": [
                {
                  "required": [
                    "symbol"
                  ]
                },
                {
                  "required": [
                    "side"
                  ]
                }
              ]
            }
          }
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "type": {
                  "const": "limit"
                }
              }
            },
            "then": {
              "required": [
                "limit_price"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "limit_price"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "market"
                }
              },
              "required": [
                "type"
              ]
            },
            "then": {
              "anyOf": [
                {
                  "properties": {
                    "time_in_force": {
                      "const": "ioc"
                    }
                  }
                },
                {
                  "required": [
                    "trigger"
                  ],
                  "properties": {
                    "time_in_force": {
                      "enum": [
                        "exto",
                        "gtc_exto",
                        "gtd"
                      ]
                    }
                  }
                }
              ]
            }
          },
          {
            "if": {
              "properties": {
                "time_in_force": {
                  "const": "gtd"
                }
              },
              "required": [
                "time_in_force"
              ]
            },
            "then": {
              "required": [
                "good_till"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "good_till"
                ]
              }
            }
          }
        ],
        "additionalProperties": false,
        "description": "An order as POST /api/orders takes it, its client_order_id optional. Chains (then and oco) are not modelled and are refused with 400 INVALID_REQUEST."
