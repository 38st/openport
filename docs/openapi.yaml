        },
        "parameters": [
          {
            "name": "archived",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ]
      },
      "post": {
        "summary": "POST /api/accounts",
        "description": "Requires admin. 409 ACCOUNTS_UNSUPPORTED on a server that keeps a single account (no accounts directory, or a replay).",
        "x-scope": "admin",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateAccountResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          },
          "422": {
            "description": "Invalid time_limit_days, inactivity_days, underlyings, trading_start, trading_end, flat_time or no_overnight: INVALID_RULES with a field-specific message. Other trading refusals also use this status.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateAccountRequest"
              }
            }
          }
        }
      }
    },
