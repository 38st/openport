          }
        },
        "responses": {
          "201": {
            "description": "Sandbox created; save the bearer token in session storage",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "account",
                    "token",
                    "idle_seconds",
                    "simulated"
                  ],
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "token": {
                      "type": "string",
