              "type": "object",
              "properties": {
                "date": {
                  "type": "string"
                },
                "pnl": {
                  "type": "object",
                  "additionalProperties": {
                    "anyOf": [
                      {
                        "type": "string",
                        "pattern": "^-?[0-9]+\\.[0-9]{2,6}$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                }
              },
              "required": [
                "date",
                "pnl"
              ]
            }
          },
          "combined": {
            "type": "object",
            "properties": {
              "label": {
                "type": "string"
              },
              "daily_pnl": {
                "$ref": "#/components/schemas/BacktestDistribution"
              },
              "curve": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/BacktestCombinedDay"
                }
              },
              "max_drawdown": {
                "anyOf": [
                  {
                    "type": "string",
                    "pattern": "^-?[0-9]+\\.[0-9]{2,6}$"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "worst_days": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/BacktestCombinedDay"
                }
              },
              "day_win_rate": {
                "type": [
                  "number",
                  "null"
                ],
                "minimum": 0,
                "maximum": 1
              }
            },
            "required": [
              "label",
              "daily_pnl",
              "curve",
              "max_drawdown",
              "worst_days",
              "day_win_rate"
            ]
          }
        },
        "required": [
          "label",
          "different_inputs",
          "different_plans",
          "incomplete_inputs",
          "apples_to_oranges",
          "runs",
          "daily",
          "combined"
        ]
      },
      "PayoutBestDay": {
        "type": "object",
        "properties": {
          "day": {
            "type": "string"
          },
          "profit": {
            "$ref": "#/components/schemas/Money"
          }
        },
        "required": [
          "day",
          "profit"
        ]
      },
      "GuardrailsInput": {
        "type": "object",
        "properties": {
          "soft_floor": {
            "$ref": "#/components/schemas/Money"
          },
          "soft_floor_percent": {
            "type": "integer",
            "description": "Whole percent of drawdown above the plan floor. New requests accept 0–99; 100 puts the floor at the peak and latches at once (INVALID_LIMITS). Stored 100 remains readable. Has no effect without a plan drawdown floor (SOFT_FLOOR_UNUSED).",
            "minimum": 0,
            "maximum": 99
          },
          "max_opening_trades": {
            "type": "number",
            "description": "Opening orders per trading day: an order counts on its first opening fill only, even if later partial fills cross rollover; an atomic multi-leg execution counts once. The order reaching the limit may finish; other opening orders are cancelled."
          },
          "cooldown_loss": {
            "$ref": "#/components/schemas/Money",
            "description": "Other closing fills also start cooldown when realised loss before fees strictly exceeds this amount."
          },
          "cooldown_minutes": {
            "type": "number",
            "description": "Market minutes of cooldown after a triggered closing stop fills. Standalone option price triggers must move adversely for the closing side; combo triggers watch signed closing debit, where a rise is adverse; underlying triggers follow the held option's call/put direction or the held combo's net delta. Trailing stops and bracket stop-losses always count. Profit-taking triggers and take-profit exits do not start it unless cooldown_loss is exceeded."
          },
          "profit_lock": {
            "$ref": "#/components/schemas/Money"
          }
        },
        "required": [
          "soft_floor",
          "soft_floor_percent",
          "max_opening_trades",
          "cooldown_loss",
          "cooldown_minutes",
          "profit_lock"
        ]
      }
    }
  }
}
