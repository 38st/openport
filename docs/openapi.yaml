  "components": {
    "securitySchemes": {
      "BearerToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "Legacy write token is admin. Named --token-file tokens grant read, trade:ACCOUNT, trade:*, replay or admin. --require-token requires read authorization for GET and WebSocket. Without it GET is public and ignores a token that matches nothing; loopback writes without a configured legacy token remain open unless --sandboxes is set. Writes always check the token they carry. Browser WebSocket credentials use a subprotocol; HTTP uses Authorization: Bearer SECRET. Named tokens reload automatically on file mtime/size changes, on SIGHUP, or via POST /api/tokens/reload (admin). Invalid reloads keep the last good set. Replay scope also permits reset, limits, guardrails and kill on isolated replay mirrors."
      }
    },
    "parameters": {
      "account": {
        "name": "account",
        "in": "query",
        "schema": {
          "type": "string",
          "default": "main",
          "maxLength": 40,
          "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        },
        "description": "Named paper account. Omit for main. Replay accounts are isolated from live accounts."
      }
    },
    "responses": {
      "Error": {
        "description": "Failure with a stable reason code and optional evidence. 400 invalid request or INVALID_RULES; 403 authentication/scope; 404 missing resource; 409 conflict (a client ID reused with other terms, a stale limits revision LIMITS_REVISION, a server that keeps a single account ACCOUNTS_UNSUPPORTED); 422 simulator rejection (including ACCOUNT_TYPE for cash/IRA restrictions); 503 inbox full or unavailable. Orders may retry using identical client_order_id and terms. Account lifecycle: 403 ACCOUNT_PROTECTED; 404 UNKNOWN_ACCOUNT; 409 ACCOUNT_ARCHIVED or ACCOUNT_NOT_EMPTY. Damaged account writes: 409 ACCOUNT_DAMAGED; stop the server and diagnose with --repair-journals --dry-run, or restore a verified backup for mid-file damage.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "headers": {
          "Retry-After": {
            "description": "Seconds to wait before retrying, sent with a 503 for a full command inbox or a stopping engine (1).",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        }
      }
    },
    "schemas": {
      "Num": {
        "anyOf": [
          {
            "type": "number"
          },
