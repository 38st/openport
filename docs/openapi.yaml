    "/api/orders": {
      "parameters": [
        {
          "$ref": "#/components/parameters/account"
        }
      ],
      "get": {
        "summary": "GET /api/orders",
        "description": "Read the current publication: every order, newest first. status=open keeps the open ones; client_order_id=ID keeps the orders that used that client ID (one per attempt that used it, since a reuse with other terms records nothing).",
        "x-scope": "read",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrdersResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "open",
                "all"
              ]
            }
          },
          {
            "name": "client_order_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          }
        ]
      },
      "post": {
        "summary": "POST /api/orders",
        "description": "Paper trading only. Requires trade:ACCOUNT (or trade:*) for live accounts; replay scope for replay accounts.",
        "x-scope": "trade",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubmitOrderResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          },
          "200": {
            "description": "A retry: the client_order_id was already used with these terms, so nothing is recorded and the order is returned as it now stands, also after a change.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubmitOrderResponse"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NewOrder"
              }
            }
          }
        }
      }
    },
