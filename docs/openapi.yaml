    "/api/accounts": {
      "get": {
        "summary": "GET /api/accounts",
        "description": "Lists active accounts. archived=true includes frozen accounts; each entry reports archived. Damaged journals remain readable at their verified prefix; damaged reports reason/last_good_seq/last_good_time. Writes return 409 ACCOUNT_DAMAGED. Journal size and warnings are included.",
        "x-scope": "read",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AccountsResponse"
