{
  "openapi": "3.1.0",
  "info": {
    "title": "OpenPort terminal API",
    "version": "1.0.0",
    "license": {
      "name": "MIT"
    },
    "description": "The terminal HTTP contract. All trades are simulated. Generated scenario/demo prices are identified by provider.simulated; recordings retain their provider and delay. Missing analytics are null. Money is exact decimal text. Unknown response fields may be added. symbols() is status.underlyings; series() is summary.expiries; neither has a separate route. JSON syntax is used here (a YAML 1.2 subset), so the web contract test needs no YAML dependency."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080"
    }
  ],
