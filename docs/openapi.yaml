            "type": "boolean",
            "description": "Multi-leg orders only: attach the bracket to held closing legs instead of submitting an entry."
          },
          "group": {
            "type": "string",
            "description": "Join the round trips this order opens to a whole trade, named by its ID or one of its open round trips' IDs (an adjustment). A multi-leg order that closes or adds to another order's round trip joins that trade without it (a roll). An order naming no trade holding an open round trip on its underlying, or attaching held exits, is refused with INVALID_GROUP."
          },
          "good_till": {
            "type": "string",
            "format": "date-time",
            "description": "Required only for gtd. ISO timestamp with Z or UTC offset, in the future and no more than 366 days after acceptance (market time). GTD trades regular hours; expires with GTD_END."
          },
