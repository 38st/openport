      "AlertRequest": {
        "type": "object",
        "description": "What to watch and when to fire. contract: bid, ask, mark, iv (vol points), delta, gamma, theta or vega of symbol, a registered OSI. spread: the net mark per unit of legs (buys add, sells subtract). underlying: price, iv30, iv7 or term_ratio of symbol. account: equity, day_pnl, unrealised, floor_room, buying_power, dollar_delta, vega or theta. level is inclusive and may be negative. A one-shot alert fires once; repeat fires again each time the condition returns after lapsing.",
