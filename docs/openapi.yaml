      "BacktestReport": {
        "type": "object",
        "properties": {
          "schema": {
            "const": 1
          },
          "simulated": {
            "const": true
          },
          "label": {
            "const": "Simulated trading on recorded or generated days. Not a prediction. Not investment advice."
          },
          "status": {
            "enum": [
              "completed",
              "cancelled",
              "failed"
            ]
          },
          "playbook": {
            "$ref": "#/components/schemas/PlaybookDefinition"
          },
          "config": {
            "type": "object",
            "description": "Full reproducible SessionConfig in journal encoding: monetary configuration fields are integer micro-dollars; enums retain their journal encoding. Result money uses decimal strings."
          },
          "analytics": {
            "type": "object"
          },
          "dividends": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "days": {
            "type": "array",
            "items": {
              "anyOf": [
                {
                  "$ref": "#/components/schemas/BacktestDay"
                },
                {
                  "type": "null"
                }
              ]
            }
          },
          "attempts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BacktestAttempt"
            }
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "day": {
                  "anyOf": [
                    {
                      "type": "integer",
                      "minimum": 0
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "message": {
                  "type": "string"
                }
              },
              "required": [
                "day",
                "message"
              ]
            }
          },
          "journals": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "summary": {
            "$ref": "#/components/schemas/BacktestSummary"
          }
        },
        "required": [
          "schema",
          "simulated",
          "label",
          "status",
          "playbook",
          "config",
          "analytics",
          "dividends",
          "days",
          "attempts",
          "errors",
          "journals",
          "summary"
        ]
      },
      "BacktestState": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          },
          "status": {
            "enum": [
              "running",
              "cancelling",
              "cancelled",
              "completed",
              "failed",
              "interrupted"
            ]
          },
          "phase": {
            "enum": [
              "days",
              "attempts",
              "finished"
            ]
          },
          "completed": {
            "type": "integer",
            "minimum": 0
          },
          "total": {
            "type": "integer",
            "minimum": 0
          },
          "directory": {
            "type": "string"
          },
          "label": {
            "const": "Simulated trading on recorded or generated days. Not a prediction. Not investment advice."
          },
          "error": {
            "type": "string"
          },
          "report": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/BacktestReport"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "id",
          "status",
          "phase",
          "completed",
          "total",
          "label",
          "report"
        ]
      },
      "BacktestListing": {
        "type": "object",
        "properties": {
          "runs": {
            "type": "array",
