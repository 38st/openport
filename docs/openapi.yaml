                "minimum": 0,
                "maximum": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "day_win_rate": {
            "anyOf": [
              {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "pass_rate": {
            "anyOf": [
              {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "daily_pnl",
          "daily_drawdown",
          "worst_days",
          "completed_days",
          "marked_days",
          "trades",
          "attempts",
          "passed",
          "failed",
          "open",
          "expectancy",
          "win_rate",
          "day_win_rate",
          "pass_rate"
