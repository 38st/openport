        "oneOf": [
          {
            "required": [
              "symbol",
              "side"
            ],
            "not": {
              "anyOf": [
                {
                  "required": [
                    "legs"
                  ]
                },
                {
                  "required": [
                    "exits_only"
                  ]
                }
              ]
            }
          },
          {
            "required": [
              "legs"
            ],
            "not": {
              "anyOf": [
                {
                  "required": [
                    "symbol"
                  ]
                },
                {
                  "required": [
                    "side"
                  ]
                }
              ]
            }
          }
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "type": {
                  "const": "limit"
                }
              }
            },
            "then": {
              "required": [
                "limit_price"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "limit_price"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "market"
                }
              },
              "required": [
                "type"
              ]
            },
            "then": {
              "anyOf": [
                {
                  "properties": {
                    "time_in_force": {
                      "const": "ioc"
                    }
                  }
                },
                {
                  "required": [
                    "trigger"
                  ],
                  "properties": {
                    "time_in_force": {
                      "enum": [
                        "exto",
                        "gtc_exto",
                        "gtd"
                      ]
                    }
                  }
                }
              ]
            }
          },
          {
            "if": {
              "properties": {
                "time_in_force": {
                  "const": "gtd"
                }
              },
              "required": [
                "time_in_force"
              ]
            },
            "then": {
              "required": [
                "good_till"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "good_till"
                ]
              }
            }
          }
        ]
