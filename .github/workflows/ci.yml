name: CI

# Changes only to the site, the docs or top-level Markdown skip the build. The
# OpenAPI contract stays in: the web, Python and Docker contract tests read it.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!site/**'
      - '!docs/**'
      - 'docs/openapi.yaml'
      - '!*.md'
  pull_request:
    paths:
      - '**'
      - '!site/**'
      - '!docs/**'
      - 'docs/openapi.yaml'
      - '!*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (GCC 13, Ubuntu 24.04, warnings as errors)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libboost-dev libssl-dev zlib1g-dev libzstd-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENPORT_WERROR=ON -DOPENPORT_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 1500
      - name: Test incremental reviews and journal changes against full rebuilds
        env:
          TMPDIR: ${{ runner.temp }}
          OPENPORT_VERIFY_REVIEWS: 1
          OPENPORT_VERIFY_JOURNAL: 1
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 1500

  cpp-sanitize:
    name: C++ (GCC 13, AddressSanitizer + UndefinedBehaviorSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libboost-dev libssl-dev zlib1g-dev libzstd-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DOPENPORT_SANITIZE=ON -DOPENPORT_WERROR=ON -DOPENPORT_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 1500

  cpp-macos:
    name: C++ (Apple Clang, macOS 15, warnings as errors)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ninja boost openssl@3 zstd
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DOPENPORT_WERROR=ON -DOPENPORT_BUILD_BENCHMARKS=OFF -DOPENPORT_STATIC_DEPS=ON
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/tests/openport_tests
      # The release archive is built this way; it must run on a Mac without Homebrew.
      - name: Links only macOS's own libraries
        run: |
          for binary in build/apps/openportd build/apps/openport-probe; do
            otool -L "$binary"
            if otool -L "$binary" | tail -n +2 | grep -v -E '^[[:space:]]+/(usr/lib|System/Library)/'; then
              echo "::error::$binary links libraries macOS does not have"
              exit 1
            fi
          done

  web:
    name: Web (TypeScript, Vitest, Vite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npx vite build

  python:
    name: Python client and MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install './python[pandas,ws,mcp]' pytest jsonschema pyyaml
      - run: python -m pytest python/tests
      - name: Formula updater (offline fixtures)
        run: python tools/update_formula_test.py
      - name: Demo soak tool (scripted replay)
        run: python tools/demo_soak_test.py
      - name: Order fuzz tool (scripted replay)
        run: python tools/order_fuzz_test.py

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t openport:ci .
      - name: Smoke test
        run: |
          docker run -d --rm --name openport -p 127.0.0.1:8080:8080 openport:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/status > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/status > /dev/null
          test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' http://127.0.0.1:8080//etc/passwd)" = 400
          # Writes need the token the image keeps in its volume; with it, an order fills.
          python3 tools/smoke_trade.py http://127.0.0.1:8080 "$(docker exec openport cat /var/lib/openport/write-token)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: API contract
        run: |
          pip install jsonschema pyyaml
          python tools/contract_test.py http://127.0.0.1:8080 --token "$(docker exec openport cat /var/lib/openport/write-token)" --spec docs/openapi.yaml
      - name: Stop smoke server
        if: always()
        run: docker stop openport
