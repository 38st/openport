name: Python release

# Publishes the openport-client distribution (import package: openport) to PyPI.
# Only python-vVERSION tags whose commit is already on main can publish; the build
# job verifies that before anything is uploaded.
#
# The publish job runs in the GitHub environment "pypi". Its protection rules are
# not stored in this file and must be configured in the repository settings
# (Settings > Environments > pypi): a deployment tag rule allowing only python-v*
# tags, and at least one required reviewer. PyPI's trusted publisher must name this
# repository, workflow file and environment.

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'python-v{version}', 'Tag must match python/pyproject.toml'
          PY
      - name: Test and build distributions
        run: |
          python -m pip install build twine './python[dev]'
          python -m pytest python/tests
          python -m build python --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openport-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish using PyPI trusted publishing
        # v1.14.3, pinned to the release commit rather than a movable tag or branch.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
