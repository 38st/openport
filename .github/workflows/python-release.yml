name: Python release

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'python-v{version}', 'Tag must match python/pyproject.toml'
          PY
      - name: Test and build distributions
        run: |
          python -m pip install build twine './python[dev]'
          python -m pytest python/tests
          python -m build python --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openport
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
